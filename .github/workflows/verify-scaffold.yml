name: Verify scaffold

# Proves that the template-owned files in this repository are exactly what
# `@n8n/node-cli` generates. The list of those files is
# `.github/scaffold-manifest.json`; `util-refresh-starter-scaffold.yml` in
# n8n-io/n8n regenerates them after every n8n release. This job runs the same
# refresh script with the same environment against the CLI version in this
# repository's lockfile, then fails if the tree is not clean.
#
# Triggers
#   - pull_request to master: the gate. Its status check is named
#     "Verify scaffold"; the master ruleset requires it. Renaming the job
#     silently drops the requirement.
#   - push to master and workflow_dispatch: detect drift after a merge.
#
# What a failure means
#   - A human PR edited a template-owned file. Change the template in
#     n8n-io/n8n (packages/@n8n/node-cli/src/template/templates) instead.
#   - A Dependabot PR bumped `@n8n/node-cli` without regenerating. Close it;
#     the refresh workflow in n8n-io/n8n moves the CLI and the files together.
#   - A bot PR on `refresh-scaffold` was generated with an older refresh script
#     than n8n master now has. Re-dispatch `util-refresh-starter-scaffold.yml`
#     in n8n-io/n8n.
#   - Once the CLI ships a trigger template, the script exits 1 until the
#     refresh PR that adds the trigger example has merged. Expected.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout n8n-nodes-starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the refresh script is needed. n8n-io/n8n is public; no token.
      - name: Checkout refresh script from n8n-io/n8n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n8n-io/n8n
          ref: master
          path: n8n
          sparse-checkout: .github/scripts/node-cli
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Same Node.js setup as the template CI (`ci.yml`).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      # The job only generates files; it never runs a node. Skipping install
      # scripts avoids compiling native modules, as the generator does.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Same environment pins as the generator: the CLI reads the package
      # manager from `npm_config_user_agent`, and an empty git config keeps the
      # runner identity out of author placeholders.
      - name: Regenerate scaffold
        env:
          npm_config_user_agent: 'npm/0.0.0 (refresh-starter-scaffold)'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: node n8n/.github/scripts/node-cli/refresh-starter-scaffold.mjs --starter-root .

      - name: Format synced files
        run: |
          node -p "require('./.github/scaffold-manifest.json').files.join('\n')" \
            | xargs npx prettier --write --ignore-unknown package.json

      - name: Assert template-owned files are unchanged
        run: |
          git add -A -- . ':(exclude)n8n'
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            CLI="$(node -p "require('./.github/scaffold-manifest.json').cliVersion")"
            echo "::error::Files differ from what @n8n/node-cli@${CLI} generates. Template-owned files are regenerated by util-refresh-starter-scaffold.yml in n8n-io/n8n; do not edit them here. To change them, edit packages/@n8n/node-cli/src/template/templates in n8n-io/n8n."
            exit 1
          fi
